# Instancia `dev` de LibraCargo en el VPS, y entorno de desarrollo local.
#
# Mismo patrón que los `dev` del resto de la familia: NO es `panel_admin.py`
# —ese vive en LibraCore y provisiona instancias de CLIENTE bajo
# `clientes/<slug>/`—. Un compose, dos redes, y Nginx Proxy Manager alcanza al
# contenedor por su alias en la red compartida.

services:
  # 🔴 La clave del servicio lleva el nombre del producto y no es `db` ni
  # `postgres`: Compose convierte la clave en un alias de red, y `stack-net` la
  # comparte todo el VPS. Dos composes con la misma clave se turnan por
  # round-robin del DNS interno — ya pasó en esta familia.
  libracargo-postgres:
    # La MISMA imagen que el CI y que producción: el collation viene de la
    # imagen y la alpine ordena por bytes.
    image: postgres:16
    # 🔴 `TZ` NO alcanza. La imagen escribe `timezone` en `postgresql.conf`
    # una sola vez, en el `initdb`: sobre un volumen que ya existe, `TZ` le
    # cambia el `date` del contenedor y no lo que hace el SERVIDOR. Y `now()`
    # es el reloj que estampa los `server_default=func.now()`, asi que mover
    # solo la app deja base y proceso desfasados. Medir con `select now()`,
    # nunca con `docker exec ... date`.
    command: postgres -c timezone=America/Argentina/Buenos_Aires
    container_name: libracargo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: libracargo
      POSTGRES_USER: libracargo
      # Sin default a propósito: `:?` aborta el `up` si falta, en vez de
      # levantar la base con una clave escrita en git.
      POSTGRES_PASSWORD: ${LIBRACARGO_POSTGRES_PASSWORD:?hay que definirla en el .env}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - libracargo-postgres-data:/var/lib/postgresql/data
      # Crea `libracargo_core` al inicializar el volumen. Ver el archivo:
      # sobre un volumen que ya existe NO corre.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libracargo -d libracargo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Sin `ports:` a propósito: sólo se llega desde la red interna.
    networks: [datos]

  libracargo-dev:
    build:
      context: .
      # Sin `ssh:`: los motores de la familia son repos PÚBLICOS hoy. Cuando
      # pasen a privados hay que agregar acá un id por paquete —uno solo no
      # alcanza, GitHub autentica toda la conexión con la primera deploy key
      # que le ofrecen— y los mounts correspondientes en el Dockerfile.
    container_name: libracargo-dev
    depends_on:
      libracargo-postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    ports:
      - "8097:8000"
    # El bind mount es para el `--reload` del código Python. Taparía el build
    # del frontend si viviera dentro de /app: por eso el Dockerfile lo hornea
    # en /opt/frontend-dist, fuera del árbol montado, y `app/asgi.py` mira
    # primero ahí.
    volumes:
      - ./:/app
      # Los ZIP de backup, en un volumen propio y NO en el árbol montado de
      # arriba: ese árbol es el checkout de git del servidor, y dejarle
      # archivos nuevos adentro le complica el `git pull` del próximo deploy.
      # Va después del bind mount a propósito — el montaje más específico gana.
      - libracargo-datos:/app/data
    # 🔴 Las migraciones también acá, no sólo en el deploy. `cmd_actualizar`
    # las corre para las instancias de cliente y la demo, pero ESTA la levanta
    # el compose del repo y el motor no la toca. El 2026-08-25 apareció con la
    # base en `0009` y el código en `0010` —el defecto del 2026-08-24 entero,
    # cero columnas `cae*` en `comprobantes`— en la instancia donde se trabaja
    # todos los días, y nadie lo había notado porque `/salud` daba 200.
    #
    # Tiene que decir LO MISMO que `migraciones` en los dos scripts de
    # `scripts/`; hay un test que ata las dos puntas, porque el modo de fallar
    # de esto es que alguien agregue una cadena allá y se olvide acá.
    #
    # `exec` para que uvicorn quede como PID 1 y `docker stop` le llegue. Si la
    # migración falla el contenedor sale con error, que es mejor que servir
    # código nuevo sobre un esquema viejo.
    command: sh -c "libracore-migrar upgrade --prefijo libracargo && alembic upgrade head && exec uvicorn app.asgi:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      # Las tres sin default: la app tiene que fallar al arrancar si falta
      # alguna, no levantar con un secreto de juguete en un dominio público.
      - SECRET_KEY=${SECRET_KEY:?hay que definirla en el .env}
      - LIBRACARGO_ADMIN_USERNAME=${LIBRACARGO_ADMIN_USERNAME:-admin}
      - LIBRACARGO_ADMIN_PASSWORD=${LIBRACARGO_ADMIN_PASSWORD:?hay que definirla en el .env}
      - DATABASE_URL=postgresql+psycopg://libracargo:${LIBRACARGO_POSTGRES_PASSWORD:?hay que definirla en el .env}@libracargo-postgres:5432/libracargo
      # La base de LibraCore, que NO es la del dominio: el schema del motor
      # declara `usuarios` y `auth_log` y las dos ya existen del otro lado
      # con la forma de `libraauth`. Sin esta variable la app no arranca —
      # a propósito: el default silencioso sería caer en la del dominio, que
      # es justo el choque que esta separación evita.
      #
      # El nombre lo define `libracore.db.url_de_instancia`, que es también
      # quien lo lee. No hay una segunda convención que pueda divergir.
      - LIBRACARGO_LIBRACORE_DATABASE_URL=postgresql+psycopg://libracargo:${LIBRACARGO_POSTGRES_PASSWORD:?hay que definirla en el .env}@libracargo-postgres:5432/libracargo_core
      - ENTORNO=dev
      # Como el backoffice (`admin.libracargo.com.ar`) administra los usuarios
      # de esta instancia. **Con default vacio a proposito**, al reves que las
      # tres de arriba: `libraauth` trata el token vacio como "no definido" y
      # `require_admin_o_servicio` se comporta igual que `require_admin`. O sea
      # que no ponerlo no abre nada; lo que abriria algo seria ponerle un valor
      # adivinable, y por eso no hay uno de ejemplo.
      - LIBRA_SERVICE_TOKEN=${LIBRA_SERVICE_TOKEN:-}
      # Dónde escribe los backups. Sin esto caen en `./data` relativo al
      # directorio de trabajo, o sea adentro del bind mount.
      - DATA_DIR=/app/data
      - TZ=America/Argentina/Buenos_Aires
      # Recuperación de contraseña y comprobantes por mail. **Sin estas seis,
      # la instancia no tiene por dónde mandar**: `resolver_smtp_config` cae al
      # entorno cuando no hay nada guardado en la base, y si el entorno tampoco
      # las trae devuelve una config vacía.
      #
      # 🔴 Faltaban acá hasta el 2026-08-30, y el síntoma era mudo: la app
      # levanta igual, `/auth/forgot-password` contesta 200 y el mail no sale.
      # Se descubrió midiendo qué resolvía `smtp_efectivo` adentro del
      # contenedor — leer el compose no alcanzaba, porque el resto de los
      # productos declara las seis con default vacío y *contar los nombres* da
      # 6 en uno configurado y 6 en uno que no.
      #
      # Los valores van en el `.env` del VPS, nunca acá. `LIBRAAUTH_SMTP_HOST`
      # vacío es "no configurado", que es lo correcto para un checkout local.
      - LIBRAAUTH_SMTP_HOST=${LIBRAAUTH_SMTP_HOST:-}
      - LIBRAAUTH_SMTP_PORT=${LIBRAAUTH_SMTP_PORT:-587}
      - LIBRAAUTH_SMTP_USER=${LIBRAAUTH_SMTP_USER:-}
      - LIBRAAUTH_SMTP_PASSWORD=${LIBRAAUTH_SMTP_PASSWORD:-}
      # ⚠️ Explícita y no por defecto al `USER`: el servidor de correo corre con
      # `SPOOF_PROTECTION=1`, que ata el remitente a la cuenta autenticada, así
      # que cualquier otra dirección es un envío rechazado.
      - LIBRAAUTH_SMTP_FROM_EMAIL=${LIBRAAUTH_SMTP_FROM_EMAIL:-}
      - LIBRAAUTH_SMTP_FROM_NAME=${LIBRAAUTH_SMTP_FROM_NAME:-LibraCargo}
    networks: [stack-net, datos]

volumes:
  libracargo-postgres-data:
  libracargo-datos:

networks:
  datos:
    name: libracargo-dev-datos
  # La red compartida del VPS, donde vive Nginx Proxy Manager. Es la que hace
  # que el proxy host pueda apuntar a `libracargo-dev:8000` por nombre.
  stack-net:
    external: true
    name: stack_stack-net
