[project]
name = "libracargo"
version = "0.1.0"
description = "LibraCargo — vertical de agencia de cargas de la familia Libra"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    # El auth de toda la familia. Se declara con `git+https` a proposito: asi
    # anda en dev local sin identidad SSH propia. El build de la imagen
    # reescribe la URL a `git+ssh` con la deploy key de solo lectura del motor
    # (ver Dockerfile), que es lo que va a hacer falta cuando la familia pase a
    # repos privados.
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.26.1",
]

# Los motores de la familia entran en F1, desde repos privados por deploy key.
# Se declaran acá y no antes para que el esqueleto se pueda construir y probar
# sin acceso a esos repos.
[project.optional-dependencies]
motores = [
    # LibraCore entra en F7 (impresion via `pdf_generator`) y F8 (ARCA). Se
    # consume PARCIAL, como LibraDesk: leer la seccion "consumo parcial" de la
    # pagina de LibraCore en el wiki antes de descomentarlo.
    # "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.39.2",
]
# La migracion del legado de Suitrans (F6). Va aparte de dev porque es
# tooling de una sola vez: la app no lo importa nunca.
migracion = [
    # Lee el MariaDB efimero donde se restaura el dump. Puro Python, sin
    # compilar nada.
    "pymysql>=1.1",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "pymysql>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "migracion*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las escribe el autogenerate: no se reformatean a mano.
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` en el default es el idioma de FastAPI, no un descuido.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
