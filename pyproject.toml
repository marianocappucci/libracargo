[project]
name = "libracargo"
version = "0.1.0"
description = "LibraCargo — vertical de agencia de cargas de la familia Libra"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    # La subida del logo del membrete: FastAPI necesita esto para UploadFile.
    "python-multipart>=0.0.9",
    # Leer el PDF del tarifario de referencia (ADR-039): texto y posiciones; los dígitos vienen con otra tipografía.
    "pdfplumber>=0.11",
    # El auth de toda la familia. Se declara con `git+https` a proposito: asi
    # anda en dev local sin identidad SSH propia. El build de la imagen
    # reescribe la URL a `git+ssh` con la deploy key de solo lectura del motor
    # (ver Dockerfile), que es lo que va a hacer falta cuando la familia pase a
    # repos privados.
    # v0.40.0 trae el captcha ALTCHA del login (ADR-014 de libraauth; arrastra
    # `altcha`) y, desde v0.39.0, la IP correcta para el bloqueo por intentos.
    # v0.43.0 (ADR-018) trae `libraauth.usuarios.build_users_router()`, el
    # router de usuarios único de la familia -- ver `app/routers/usuarios.py`.
    # Trae también la sesión por inactividad de 8h con renovación deslizante
    # (ADR-017).
    "libraauth[migrations] @ git+https://github.com/marianocappucci/libraauth.git@v0.46.0",
    # 🔑 **LibraCore entra ACÁ y no en F7, y sólo por `respaldo`.** El plan lo
    # tenía para la impresión (`pdf_generator`) y ARCA; el backup se pidió
    # antes. Se adelanta el paquete, no el alcance: hoy este producto importa
    # `respaldo` y `config_router.build_backup_router`, nada más.
    #
    # Las tres trampas del consumo parcial que documenta [[libradesk]] son
    # todas de la CAPA DE DATOS —`PRAGMA foreign_keys` no configurable,
    # `init_core_schema()` que no es componible por tabla, y el DDL que no es
    # el schema real—. `respaldo` no toca nada de eso: recibe una URL y
    # corre `pg_dump`. Por eso este adelanto no arrastra ninguna de las tres.
    # El extra `[migrations]` es el que trae **alembic**, que LibraCore no
    # declara como dependencia propia. Sin él, `libracore-migrar` muere con
    # `ModuleNotFoundError: No module named 'alembic'` en medio del deploy,
    # que manda a buscar el problema en el lugar equivocado. Entra ahora
    # porque este producto pasó a llevar el schema del motor (ARCA).
    # v1.121.0 -> v1.122.0 (2026-10-03): `libracore.testing.pg_por_worker`, el helper de TEST que da una
    # base por worker de xdist (reglas/ci.md del wiki). Sin migracion: el salto es un modulo nuevo y su
    # test; no cambia nada de lo que corre en produccion.
    # v1.122.0 -> v1.123.0 (2026-10-03): `get_config().clientes_dir` (precedencia `configure(clientes_dir=)` >
    # env `LIBRA_CLIENTES_DIR` > `repo_root/"clientes"`), para sacar `clientes/` del arbol del repo. El default
    # no cambia. Sin migracion.
    # v1.123.0 -> v1.124.0 (2026-10-04): la guarda del CUIT del receptor pasa al motor
    # (`arca_wsfe.problema_del_receptor`, que `solicitar_cae` ya corre antes de llamar a ARCA) y la nota de
    # credito repetida da 409 (este producto no usa ese endpoint). Sin migracion.
    # v1.124.0 -> v1.126.0 (2026-10-04): suma el nucleo `libracore.notas_de_credito` (este producto todavia no lo usa); la guarda del CUIT del receptor deja de bloquear las notas (ARCA autoriza la nota de credito a un CUIT que no cierra, igual que la factura), e incluye v1.125.0 (los routers de libracore rechazan booleanos en los campos numericos). Sin migracion.
    # v1.127.0 -> v1.131.0 (2026-10-05): la nota de credito PARCIAL con tope acumulado (v1.130.0) y la nota total de una FCE frenada antes
    # de ir a ARCA (v1.131.0); incluye v1.128.0 y v1.129.0 (marca de la nota en la cuenta corriente, router de solo nota). Sin migracion del motor.
    # v1.140.0 -> v1.141.0 (2026-10-06): el PDF de los comprobantes normalizado (ADR-031 de libracore):
    # `emisor_del_pdf` con su resolvedor por producto, el logo en el emisor y `build_comprobantes_pdf_router`
    # (`GET /{id}/pdf` y `POST /{id}/enviar-email`). Sin migracion.
    # v1.141.0 -> v1.142.0 (2026-10-07): credenciales y estado de ARCA por servicio web; LibraCargo suma `wscpe` (CTG y Carta de Porte) a Configuracion -> ARCA. Migracion 0022.
    # v1.142.0 -> v1.143.0 (2026-10-07): `libracore.arca_wscpe`, la lectura de la Carta de Porte de ARCA por su CTG (ADR-034 de libracore); la usa la pantalla de Cartas de porte (ADR-036). Sin migracion del motor.
    # v1.143.0 -> v1.144.0 (2026-10-08): la emision de la Carta de Porte en `libracore.arca_wscpe` (ADR-035 de libracore); la usa la emision desde la orden (fase 4). Sin migracion del motor.
    # v1.144.0 -> v1.145.0 (2026-10-08): `geografia.localidad(id)` para vincular las localidades al catalogo (ADR-041). Sin migracion del motor.
    # v1.145.0 -> v1.146.0 (2026-10-08): el resto del Mercosur en el catalogo geografico (geografia.paises, parametro pais). Sin migracion del motor.
    # v1.146.0 -> v1.147.0 (2026-10-08): el pedido de certificado de ARCA se genera en el servidor (ADR-036 de libracore: rutas `.../pedido`; `GET .../servicios` suma `admite_pedido`). Sin migracion.
    # v1.147.0 -> v1.148.0 (2026-10-09): filtros de fecha por dia completo (`libracore.fechas`, ADR-037): una fila con hora del ultimo dia entra en reportes, listados y libros. Sin migracion.
    # v1.148.0 -> v1.149.0 (2026-10-09): en una demo (`DEMO_MODE=1`) la empresa es siempre ficticia: `config_manager.load()` pisa los datos de la empresa y `resolve_logo_path()` solo devuelve el logo de demo (ADR-038 de libracore). Fuera de una demo no cambia nada. Sin migracion.
    # v1.149.0 -> v1.150.0 (2026-10-09): `libracore-demo-codigos` (ADR-039): el reset de la demo guarda y devuelve los codigos de acceso. Sin migracion.
    # v1.150.0 -> v1.151.0 (2026-10-09): un plan retirado se resuelve con `PLANES_RETIRADOS` en el alta y en el cambio de plan (`provisioning.resolver_plan`, libracore#375). Este producto no retira planes: no cambia nada. Sin migracion.
    "libracore[migrations] @ git+https://github.com/marianocappucci/libracore.git@v1.151.0",
]

# Los motores de la familia entran en F1, desde repos privados por deploy key.
# Se declaran acá y no antes para que el esqueleto se pueda construir y probar
# sin acceso a esos repos.
[project.optional-dependencies]
motores = [
    # LibraCore ya NO está acá: pasó a las dependencias obligatorias cuando
    # entró el backup (ver el comentario allá arriba). Lo que sigue difiriéndose
    # es su ALCANCE — `pdf_generator` en F7 y ARCA en F8—, no el paquete.
]
# La migracion del legado de Suitrans (F6). Va aparte de dev porque es
# tooling de una sola vez: la app no lo importa nunca.
migracion = [
    # Lee el MariaDB efimero donde se restaura el dump. Puro Python, sin
    # compilar nada.
    "pymysql>=1.1",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # F3 (2026-09-05, reglas/ci.md del wiki): la suite corre en varios procesos,
    # una base por worker (tests/conftest.py).
    "pytest-xdist>=3.8",
    "httpx>=0.27",
    "ruff>=0.8",
    "pymysql>=1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "migracion*"]

[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
# Un solo regimen de lint para los 17 repos de la familia (etapa E2 de la
# auditoria, 2026-09-03). Antes convivian dos: este --el que ya usaban
# LibraCargo y LibraClub-- y uno mucho mas corto en los otros 15, que solo
# miraba errores seguros en runtime (E9/F63/F7/F811/F821/F822/F823/F841) y
# no veia orden de imports, modernizacion ni los patrones de bugbear.
#
# La longitud queda en 120, que es la que ya usaban 13 de los 15: bajarla a
# 100 agregaba ~400 E501 en la familia, que no tienen fix automatico y no
# arreglan nada.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las escribe el autogenerate: no se reformatean a mano.
"**/migrations/versions/*.py" = ["E501"]
# En un `__init__.py` el import "sin usar" ES la interfaz del paquete.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` en el default es el idioma de FastAPI, no un descuido.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File",
    "fastapi.Form", "fastapi.Header", "fastapi.Cookie", "fastapi.Body",
]

[tool.pytest.ini_options]
markers = [
    "sin_aceptar_terminos: deja al test afuera de la excepcion autouse del conftest, para medir el gate de Terminos con el corte puesto de verdad",
    "con_emisor: el test arranca con la empresa lista para emitir por ARCA (certificado cargado y ARCA simulada); ver la fixture `emisor` del conftest",
]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
show_missing = true
# Piso de cobertura. Es un TRINQUETE, no una meta: se fija 2 puntos por
# debajo de lo que el repo mide HOY (97%, medido en el CI del
# 2026-09-03), asi que pasa holgado y lo unico que puede ponerlo en rojo es
# una regresion. Cuando la cobertura suba de verdad, subir tambien este
# numero -- nunca bajarlo para que pase un cambio.
fail_under = 95
